<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 추첨기</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: min(78vw, 538px);
        height: auto;
        aspect-ratio: 269 / 356;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="machine" width="269" height="356" aria-label="바람과 중력이 적용된 로또 추첨기"></canvas>
    <script>
      /* Figma Frame 1의 269 × 356 좌표계를 그대로 사용합니다. */
      const canvas = document.querySelector('#machine');
      const ctx = canvas.getContext('2d');
      const globe = { x: 131, y: 136, r: 91 };
      const ballRadius = 19.5;
      const colors = ['#3bc080', '#76f6b8', '#60e7a6', '#76f6b8', '#60e7a6', '#76f6b8', '#3bc080'];
      const figmaStart = [
        [103.5, 203.5], [135.5, 203.5], [169.5, 194.5], [193.5, 174.5],
        [111.5, 174.5], [80.5, 180.5], [148.5, 168.5]
      ];
      let balls = [], grabbed = null, last = performance.now();

      function reset() {
        balls = figmaStart.map(([x, y], i) => ({
          x, y, r: ballRadius, color: colors[i],
          vx: (Math.random() - .5) * 15,
          vy: (Math.random() - .5) * 8
        }));
      }
      reset();

      function collideBalls(a, b) {
        const dx = b.x - a.x, dy = b.y - a.y;
        const min = a.r + b.r, dist2 = dx * dx + dy * dy;
        if (!dist2 || dist2 >= min * min) return;
        const dist = Math.sqrt(dist2), nx = dx / dist, ny = dy / dist;
        const overlap = (min - dist) * .5;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const speed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (speed < 0) {
          const impulse = speed * .83;
          a.vx += impulse * nx; a.vy += impulse * ny;
          b.vx -= impulse * nx; b.vy -= impulse * ny;
        }
      }

      function collideGlobe(b) {
        const dx = b.x - globe.x, dy = b.y - globe.y;
        const max = globe.r - b.r, distance = Math.hypot(dx, dy);
        if (distance <= max) return;
        const nx = dx / distance, ny = dy / distance;
        b.x = globe.x + nx * max; b.y = globe.y + ny * max;
        const out = b.vx * nx + b.vy * ny;
        if (out > 0) { b.vx -= out * 1.58 * nx; b.vy -= out * 1.58 * ny; }
      }

      function update(time, dt) {
        for (const b of balls) {
          if (b === grabbed) continue;
          const lower = Math.max(0, (b.y - 150) / 52);
          const nozzle = Math.max(0, 1 - Math.abs(b.x - globe.x) / 76);
          const lift = 105 * lower * nozzle; // 바닥 송풍은 보조 역할만
          const rx = (b.x - globe.x) / globe.r;
          const ry = (b.y - globe.y) / globe.r;
          b.vy += (22 - lift) * dt;
          // 벽을 타는 일정한 회전 대신, 방향이 계속 바뀌는 내부 난류장.
          // 중심 복원력을 조금 둬서 공이 벽면에 오래 머물지 않게 한다.
          const flowX = Math.sin(time * .005 + b.y * .13) * 165 + Math.cos(time * .009 + b.x * .09) * 112;
          const flowY = Math.cos(time * .006 + b.x * .11) * 158 + Math.sin(time * .010 + b.y * .08) * 98;
          b.vx += (flowX - rx * 130) * dt;
          b.vy += (flowY - ry * 130) * dt;
          b.vx *= .999; b.vy *= .999;
        }
        // 공끼리의 충돌은 의도적으로 끄고, 유리통 벽과만 충돌시킨다.
        balls.forEach(collideGlobe);
        for (const b of balls) if (b !== grabbed) { b.x += b.vx * dt; b.y += b.vy * dt; }
      }

      function roundedRect(x, y, w, h, r, fill) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
      }
      function drawBase() {
        // Rectangle 1의 Figma fill geometry: x=51, y=217, width=159.5, height=93
        ctx.beginPath();
        ctx.moveTo(87.609, 217);
        ctx.lineTo(176.825, 217);
        ctx.bezierCurveTo(185.926,217,193.749,223.454,195.479,232.390);
        ctx.lineTo(206.124,287.390);
        ctx.bezierCurveTo(208.393,299.114,199.412,310,187.470,310);
        ctx.lineTo(74.894,310);
        ctx.bezierCurveTo(62.672,310,53.629,298.628,56.381,286.720);
        ctx.lineTo(69.097,231.720);
        ctx.bezierCurveTo(71.089,223.103,78.764,217,87.609,217);
        ctx.closePath(); ctx.fillStyle = '#2fc281'; ctx.fill();
        // Rectangle 2: 상단만 둥글게, 하단 좌우 모서리는 0px
        ctx.beginPath();
        ctx.moveTo(106, 310);
        ctx.lineTo(106, 274);
        ctx.arcTo(106, 249, 131, 249, 25);
        ctx.arcTo(156, 249, 156, 274, 25);
        ctx.lineTo(156, 310);
        ctx.closePath(); ctx.fillStyle = '#1a8b5a'; ctx.fill();
      }
      function draw(time) {
        ctx.clearRect(0, 0, 269, 356);
        // Frame 3: 흰 유리통. 중앙은 거의 흰색, 가장자리는 아주 옅은 하늘빛으로 구분한다.
        const glassBase = ctx.createRadialGradient(globe.x - 27, globe.y - 34, 9, globe.x, globe.y, globe.r);
        glassBase.addColorStop(0, '#ffffff');
        glassBase.addColorStop(.62, '#fbfdff');
        glassBase.addColorStop(1, '#e3f5ff');
        ctx.beginPath(); ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2); ctx.fillStyle = glassBase; ctx.fill();
        // 공은 Frame 3 안쪽에서만 렌더링
        ctx.save(); ctx.beginPath(); ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2); ctx.clip();
        for (const b of balls) {
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill();
        }
        ctx.restore();
        // 안쪽 그림자와 유리 림: 공의 색은 유지하면서 유리통의 경계만 분명하게 만든다.
        ctx.save();
        ctx.beginPath(); ctx.arc(globe.x, globe.y, globe.r, 0, Math.PI * 2); ctx.clip();
        const innerShade = ctx.createRadialGradient(globe.x, globe.y - 8, globe.r * .58, globe.x, globe.y, globe.r);
        innerShade.addColorStop(0, 'rgba(191, 230, 247, 0)');
        innerShade.addColorStop(.73, 'rgba(191, 230, 247, 0)');
        innerShade.addColorStop(1, 'rgba(125, 195, 225, .34)');
        ctx.fillStyle = innerShade; ctx.fillRect(40, 45, 182, 182);
        ctx.restore();
        ctx.beginPath(); ctx.arc(globe.x, globe.y, globe.r - 1, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(129, 196, 225, .62)'; ctx.lineWidth = 2; ctx.stroke();
        // Frame 2: 원본 좌표(91,29,79,25). 유리통보다 앞에 렌더링한다.
        ctx.beginPath();
        ctx.moveTo(91, 54);
        ctx.lineTo(91, 48);
        ctx.bezierCurveTo(91, 37.5, 99.5, 29, 110, 29);
        ctx.lineTo(151, 29);
        ctx.bezierCurveTo(161.5, 29, 170, 37.5, 170, 48);
        ctx.lineTo(170, 54);
        ctx.closePath(); ctx.fillStyle = '#2fc281'; ctx.fill();
        drawBase();
      }
      function loop(now) {
        const dt = Math.min(.025, (now - last) / 1000); last = now;
        update(now, dt); draw(now); requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      function pointer(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX-r.left)*269/r.width, y: (e.clientY-r.top)*356/r.height }; }
      canvas.addEventListener('pointerdown', e => { const p = pointer(e); grabbed = balls.find(b => Math.hypot(b.x-p.x, b.y-p.y) < b.r); if (grabbed) canvas.setPointerCapture(e.pointerId); });
      canvas.addEventListener('pointermove', e => { if (!grabbed) return; Object.assign(grabbed, pointer(e)); grabbed.vx = grabbed.vy = 0; collideGlobe(grabbed); });
      canvas.addEventListener('pointerup', () => { grabbed = null; });
      canvas.addEventListener('dblclick', reset);
    </script>
  </body>
</html>

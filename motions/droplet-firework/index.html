<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>물방울형 폭죽 Lottie 미리보기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff6f1;
      color: #1f2a27;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    }

    main {
      width: min(520px, calc(100vw - 32px));
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 32px 0;
    }

    .stage {
      width: min(420px, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 127, 154, 0.20);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 47%, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.72) 42%, rgba(255, 235, 226, 0.82) 100%),
        #fffaf7;
    }

    #lottie {
      width: 100%;
      height: 100%;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      height: 36px;
      min-width: 84px;
      border: 1px solid rgba(31, 42, 39, 0.16);
      border-radius: 7px;
      background: #ffffff;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #fff7f3;
    }

    .meta {
      margin: 0;
      color: #64746f;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="타원 파편 로티 미리보기">
      <div id="lottie"></div>
    </section>
    <div class="toolbar">
      <button type="button" data-action="play">재생</button>
      <button type="button" data-action="pause">정지</button>
      <button type="button" data-action="restart">처음부터</button>
    </div>
    <p class="meta">핑크 톤 물방울 파편이 부드럽게 퍼지는 Lottie 모션입니다.</p>
  </main>

  <script>
    const animation = lottie.loadAnimation({
      container: document.getElementById("lottie"),
      renderer: "svg",
      loop: true,
      autoplay: true,
      path: `./droplet-firework.json?v=${Date.now()}`
    });

    document.querySelector(".toolbar").addEventListener("click", (event) => {
      const action = event.target.dataset.action;
      if (action === "play") animation.play();
      if (action === "pause") animation.pause();
      if (action === "restart") {
        animation.goToAndPlay(0, true);
      }
    });
  </script>
</body>
</html>

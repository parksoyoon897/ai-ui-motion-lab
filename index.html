<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI UI Motion Lab</title>
  <style>
    :root {
      color: #241a1c;
      background: #fff8f5;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 30% 20%, #ffe8df 0, transparent 34%), #fff8f5;
    }

    main {
      width: min(920px, 100%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 7vw, 76px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 32px;
      max-width: 620px;
      color: #6e575d;
      font-size: 18px;
      line-height: 1.65;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid #f1c9c6;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 18px 50px rgba(214, 105, 112, .13);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #e88994;
      box-shadow: 0 22px 60px rgba(214, 105, 112, .18);
    }

    .title {
      font-size: 23px;
      font-weight: 760;
      line-height: 1.25;
    }

    .desc {
      color: #7b6268;
      font-size: 15px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI UI Motion Lab</h1>
    <p>AI와 UI 사이에서 빠르게 실험한 Lottie 모션 프로토타입을 모아두는 작은 모션 실험실입니다.</p>
    <section class="grid" aria-label="Motion demos">
      <a class="card" href="./motions/lotto-machine/">
        <span class="title">로또 머신 Lottie</span>
        <span class="desc">로또 추첨기 구조와 공 움직임을 테스트한 모션입니다.</span>
      </a>
      <a class="card" href="./motions/droplet-firework/">
        <span class="title">물방울형 폭죽 Lottie</span>
        <span class="desc">중심에서 핑크 톤 물방울 파편이 부드럽게 퍼지는 모션입니다.</span>
      </a>
    </section>
  </main>
</body>
</html>
